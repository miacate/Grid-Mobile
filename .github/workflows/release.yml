name: Grid Release

on:
  workflow_dispatch:
    inputs:
      skip_github_release:
        description: 'Skip cutting a public GitHub Release (TestFlight + Play only)'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-changes:
    name: Check for Changes
    runs-on: macos-14
    outputs:
      should_release: ${{ steps.changes.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: changes
        run: |
          LAST_TAG=$(git tag -l "v*" | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            COMMITS=$(git rev-list ${LAST_TAG}..HEAD --count)
            echo "Commits since $LAST_TAG: $COMMITS"
            if [ "$COMMITS" -gt "0" ]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "No changes since last release, skipping"
            fi
          fi

  release:
    name: Build, Publish & Release
    runs-on: macos-14
    needs: check-changes
    if: needs.check-changes.outputs.should_release == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          BUILD_NUMBER=$(( ${{ github.run_number }} + 784 ))
          sed -i '' "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "📦 Release version: ${VERSION_NAME}+${BUILD_NUMBER}"
          echo "version=${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          MATRIX_SERVER_URL=https://matrix.mygrid.app
          GAUTH_URL=https://gauth.mygrid.app
          HOMESERVER=matrix.mygrid.app
          MAPS_URL=https://map.mygrid.app/v1/protomaps.pmtiles
          VERSION_CHECK_URL=https://version.mygrid.app
          EOF
            
      - name: Build Android
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload Android to Play Store Internal
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          export PATH="/opt/homebrew/lib/ruby/gems/3.3.0/bin:/opt/homebrew/opt/ruby@3.3/bin:/opt/homebrew/bin:$PATH"
          fastlane run copy_artifacts

      - name: Create GitHub Release
        if: ${{ inputs.skip_github_release != true }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STORE_NOTES=$(bash scripts/build-release-notes.sh)

          gh release create "v${VERSION}" \
            --title "Grid v${VERSION}" \
            --notes "## Release Notes
          ${STORE_NOTES}

          ---
          - 🤖 Android: Uploaded as draft to Play Store internal (manual promotion)" \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk
